name: CICD - Deploy to staging environment

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY_HMG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_HMG }}
        if_key_exists: replace

    - name: Setup SSH config for tunnel
      run: |
        mkdir -p ~/.ssh
        cat > ~/.ssh/config << EOF
        Host app-server
          HostName 10.21.0.125
          User raphael
          Port 22
          ProxyCommand ssh -p ${{ vars.SSH_PORT_HMG }} -W %h:%p ${{ vars.SSH_USER_HMG }}@${{ vars.SSH_HOST_HMG }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

    - name: Deploy to staging server
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ssh app-server '
          set -e
          echo "🚀 Starting staging deployment..."

          echo "📂 Navigating to: /opt/sistema_pei_hmg"
          cd /opt/sistema_pei_hmg

          echo "📂 Current branch:"
          git branch --show-current

          echo "📥 Updating source code..."

          # Configure git to use HTTPS instead of SSH
          git remote set-url origin https://github.com/'"$GITHUB_REPOSITORY"'.git

          # Fetch and pull using HTTPS
          git fetch origin
          git checkout staging
          git pull origin staging

          echo "🔧 Verifying configurations..."
          if [ ! -f ".envs/.hmg/.django" ]; then
            echo "❌ ERROR: Django config file not found!"
            find .envs -type f 2>/dev/null || echo "No .envs directory found"
            exit 1
          fi

          mkdir -p logs

          echo "🛑 Stopping existing containers..."
          docker compose -f docker-compose.hmg.yml down --timeout 30 || true

          echo "🧹 Cleaning up old resources..."
          docker image prune -f --filter "until=72h" || true

          echo "🔨 Building and starting containers..."
          docker compose -f docker-compose.hmg.yml build --no-cache
          docker compose -f docker-compose.hmg.yml up -d

          echo "⏳ Waiting for containers to start..."
          sleep 30

          echo "🏥 Testing application health..."
          for i in {1..3}; do
            if curl -f -s -o /dev/null http://localhost:8080 || curl -f -s -o /dev/null http://localhost; then
              echo "✅ Health check passed"
              break
            elif [ $i -eq 3 ]; then
              echo "❌ Health check failed after 3 attempts"
              docker compose -f docker-compose.hmg.yml logs --tail=50
              exit 1
            else
              echo "⏳ Health check attempt $i/3 failed, retrying..."
              sleep 10
            fi
          done

          echo "📊 Container status:"
          docker compose -f docker-compose.hmg.yml ps

          echo "🎉 Staging deployment completed successfully!"
        '
