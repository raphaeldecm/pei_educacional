name: Deploy to staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout staging branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY_HMG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_HMG }}
        if_key_exists: replace

    - name: Setup SSH config for tunnel
      run: |
        mkdir -p ~/.ssh
        cat > ~/.ssh/config << EOF
        Host app-server
          HostName 10.21.0.125
          User raphael
          Port 22
          ProxyCommand ssh -p ${{ vars.SSH_PORT_HMG }} -W %h:%p ${{ vars.SSH_USER_HMG }}@${{ vars.SSH_HOST_HMG }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

    - name: Deploy to staging server
      run: |
        echo "🚀 Starting deployment to staging environment"
        echo "Repository: ${{ github.repository }}"
        echo "SHA: ${{ github.sha }}"

        ssh app-server '
          set -e

          # Fix pyenv path issue
          export PATH="$HOME/.pyenv/bin:$PATH"

          echo "🚀 Starting staging deployment..."
          cd /opt/sistema_pei_hmg

          echo "📥 Updating source code..."
          git remote set-url origin git@github.com:ifrn-pei/sistema_pei.git
          git fetch origin
          git checkout staging
          git pull origin staging

          echo "🔧 Verifying configurations..."
          if [ ! -f ".envs/.hmg/.django" ]; then
            echo "❌ ERROR: Django config file not found!"
            exit 1
          fi

          mkdir -p logs

          echo "🛑 Stopping existing containers..."
          docker compose -f docker-compose.hmg.yml down --timeout 30 || true

          echo "💾 Checking disk space..."
          df -h | head -2

          echo "🧹 Cleaning up Docker resources..."
          # Limpeza agressiva para liberar espaço
          docker system prune -af --volumes || true
          docker builder prune -af || true
          docker image prune -af || true

          echo "💾 Disk space after cleanup:"
          df -h | head -2

          echo "🔨 Building and starting containers..."
          # Build otimizado para espaço em disco
          export DOCKER_BUILDKIT=1
          docker compose -f docker-compose.hmg.yml build --no-cache --force-rm
          docker compose -f docker-compose.hmg.yml up -d

          echo "⏳ Waiting for containers to start..."
          sleep 30

          echo "🏥 Testing application health..."
          docker compose -f docker-compose.hmg.yml ps

          # Health check
          for i in {1..3}; do
            if curl -f -s -o /dev/null -H "Host: pei-hmg.ifrn.edu.br" http://10.21.0.125:8080 || \
               curl -f -s -o /dev/null http://10.21.0.125:8080; then
              echo "✅ Health check passed"
              break
            elif [ $i -eq 3 ]; then
              echo "❌ Health check failed after 3 attempts"
              docker compose -f docker-compose.hmg.yml logs --tail=20 django
              exit 1
            else
              echo "⏳ Health check attempt $i/3 failed, retrying..."
              sleep 10
            fi
          done

          echo "🔍 Final verification..."
          RUNNING_CONTAINERS=$(docker compose -f docker-compose.hmg.yml ps --services --filter "status=running" | wc -l)
          if [ "$RUNNING_CONTAINERS" -gt 0 ]; then
            echo "✅ $RUNNING_CONTAINERS containers running successfully"
          else
            echo "❌ No containers are running"
            exit 1
          fi

          echo "🎉 Staging deployment completed successfully!"
          echo "🌐 Application available at: https://pei-hmg.ifrn.edu.br/"
        '
