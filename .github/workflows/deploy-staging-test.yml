name: Deploy to staging (no environment)

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout staging branch
      uses: actions/checkout@v4

    - name: Debug branch and context information
      run: |
        echo "=== DEBUG INFORMATION ==="
        echo "Current branch: $(git branch --show-current || echo 'detached')"
        echo "Current commit: $(git rev-parse HEAD)"
        echo "GitHub ref: ${{ github.ref }}"
        echo "GitHub head ref: ${{ github.head_ref }}"
        echo "Event name: ${{ github.event_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "Actor: ${{ github.actor }}"
        echo "Workflow: ${{ github.workflow }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "SHA: ${{ github.sha }}"
        echo "========================="

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY_HMG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_HMG }}
        if_key_exists: replace

    - name: Setup SSH config for tunnel
      run: |
        mkdir -p ~/.ssh
        cat > ~/.ssh/config << EOF
        Host app-server
          HostName 10.21.0.125
          User raphael
          Port 22
          ProxyCommand ssh -p ${{ vars.SSH_PORT_HMG }} -W %h:%p ${{ vars.SSH_USER_HMG }}@${{ vars.SSH_HOST_HMG }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF

    - name: Deploy to staging server
      run: |
        echo "🚀 Starting deployment from GitHub Actions..."
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"

        ssh app-server '
          set -e

          # Fix pyenv path issue
          export PATH="$HOME/.pyenv/bin:$PATH"

          echo "🚀 Starting staging deployment..."

          echo "📂 Navigating to: /opt/sistema_pei_hmg"
          cd /opt/sistema_pei_hmg

          echo "📂 Current branch:"
          git branch --show-current

          echo "📥 Updating source code..."

          # Ensure we are using SSH for GitHub (correct repository)
          git remote set-url origin git@github.com:ifrn-pei/sistema_pei.git

          # Fetch and pull using SSH
          git fetch origin
          git checkout staging
          git pull origin staging

          echo "🔧 Verifying configurations..."
          if [ ! -f ".envs/.hmg/.django" ]; then
            echo "❌ ERROR: Django config file not found!"
            find .envs -type f 2>/dev/null || echo "No .envs directory found"
            exit 1
          fi

          mkdir -p logs

          echo "🛑 Stopping existing containers..."
          docker compose -f docker-compose.hmg.yml down --timeout 30 || true

          echo "🧹 Cleaning up old resources..."
          docker image prune -f --filter "until=72h" || true

          echo "🔨 Building and starting containers..."
          docker compose -f docker-compose.hmg.yml build --no-cache
          docker compose -f docker-compose.hmg.yml up -d

          echo "⏳ Waiting for containers to start..."
          sleep 30

          echo "🏥 Testing application health..."

          # Check container status first
          echo "📊 Container status:"
          docker compose -f docker-compose.hmg.yml ps

          # Test with the correct host that is in ALLOWED_HOSTS
          for i in {1..3}; do
            if curl -f -s -o /dev/null -H "Host: pei-hmg.ifrn.edu.br" http://10.21.0.125:8080 || \
               curl -f -s -o /dev/null http://10.21.0.125:8080; then
              echo "✅ Health check passed (attempt $i)"
              break
            elif [ $i -eq 3 ]; then
              echo "❌ Health check failed after 3 attempts"
              echo "🔍 Checking Django container health..."
              docker compose -f docker-compose.hmg.yml exec -T django python manage.py check --deploy || true
              echo "📋 Recent container logs:"
              docker compose -f docker-compose.hmg.yml logs --tail=20 django
              exit 1
            else
              echo "⏳ Health check attempt $i/3 failed, retrying..."
              sleep 10
            fi
          done

          echo "🔍 Final container verification..."
          RUNNING_CONTAINERS=$(docker compose -f docker-compose.hmg.yml ps --services --filter "status=running" | wc -l)
          if [ "$RUNNING_CONTAINERS" -gt 0 ]; then
            echo "✅ $RUNNING_CONTAINERS containers are running"
          else
            echo "❌ No containers are running"
            exit 1
          fi

          echo "🎉 Staging deployment completed successfully!"
          echo "🌐 Application should be available at: https://pei-hmg.ifrn.edu.br/"
        '
