name: Test SSH Connection via Tunnel

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Test network connectivity
      run: |
        echo "Testing connectivity to tunnel server..."
        ping -c 3 zaira.ifrn.edu.br || echo "Ping failed (might be blocked)"

        echo "Testing tunnel port connectivity..."
        timeout 10 bash -c "</dev/tcp/zaira.ifrn.edu.br/65222" && echo "Port 65222 is open" || echo "Port 65222 issue"

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY_HMG }}
        known_hosts: ${{ secrets.KNOWN_HOSTS_HMG }}
        if_key_exists: replace

    - name: Test SSH Connection via Tunnel
      run: |
        echo "Testing SSH connection via tunnel..."
        echo "Connecting to: ${{ vars.SSH_USER_HMG }}@${{ vars.SSH_HOST_HMG }}:${{ vars.SSH_PORT_HMG }}"
        ssh -v -p ${{ vars.SSH_PORT_HMG }} -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ vars.SSH_USER_HMG }}@${{ vars.SSH_HOST_HMG }} "echo 'SSH via tunnel successful!'; whoami; hostname; pwd"
