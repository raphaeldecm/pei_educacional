volumes:
  prod_pei_postgres_data: {}
  prod_pei_postgres_data_backups: {}
  prod_pei_redis_data: {}
  prod_pei_media_data: {}
  prod_pei_static_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: prod_pei_django
    container_name: prod_pei_django
    depends_on:
      - postgres
      - redis
    volumes:
      - prod_pei_static_data:/app/staticfiles
      - prod_pei_media_data:/app/sistema_pei/media
    env_file:
      - ./.envs/.prod/.django
      - ./.envs/.prod/.postgres
    command: /start
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: prod_pei_postgres
    container_name: prod_pei_postgres
    volumes:
      - prod_pei_postgres_data:/var/lib/postgresql/data
      - prod_pei_postgres_data_backups:/backups
    env_file:
      - ./.envs/.prod/.postgres
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: prod_pei_nginx
    container_name: prod_pei_nginx
    volumes:
      - prod_pei_static_data:/app/staticfiles
      - prod_pei_media_data:/app/sistema_pei/media
    ports:
      - 80:80
    restart: unless-stopped
    depends_on:
      - django

  redis:
    image: docker.io/redis:6
    container_name: prod_pei_redis
    volumes:
      - prod_pei_redis_data:/data
    restart: unless-stopped

  celeryworker:
    <<: *django
    image: prod_pei_celeryworker
    container_name: prod_pei_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker
    restart: unless-stopped

  celerybeat:
    <<: *django
    image: prod_pei_celerybeat
    container_name: prod_pei_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat
    restart: unless-stopped

  flower:
    <<: *django
    image: prod_pei_flower
    container_name: prod_pei_flower
    ports:
      - '5555:5555'
    command: /start-flower
    restart: unless-stopped
