volumes:
  sistema_pei_local_postgres_data: {}
  sistema_pei_local_postgres_data_backups: {}
  sistema_pei_local_redis_data: {}
  media_data: {}
  static_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: sistema_pei_local_django
    container_name: sistema_pei_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - static_data:/app/staticfiles
#      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
#    ports:
#      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: sistema_pei_production_postgres
    container_name: sistema_pei_local_postgres
    volumes:
      - sistema_pei_local_postgres_data:/var/lib/postgresql/data
      - sistema_pei_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - 84:80
    restart: unless-stopped  

  redis:
    image: docker.io/redis:6
    container_name: sistema_pei_local_redis

    volumes:
      - sistema_pei_local_redis_data:/data

  celeryworker:
    <<: *django
    image: sistema_pei_local_celeryworker
    container_name: sistema_pei_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: sistema_pei_local_celerybeat
    container_name: sistema_pei_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: sistema_pei_local_flower
    container_name: sistema_pei_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
