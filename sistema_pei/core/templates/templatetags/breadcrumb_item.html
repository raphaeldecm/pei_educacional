{% load static i18n %}

{% if can_view_breadcumb %}
  {% if not first %}
    <img src="{% static 'images/icons/icon-breadcrumbs-arrow.svg' %}"
         alt=""
         width="10px"
         height="20px" />
  {% endif %}
  <a href="{% if url %}{{ url }}{% else %}#{% endif %}"
     class="flex gap-[10px] font-medium text-[16px] text-green-500 items-center">
    <img src="{% static icon %}" class="w-[19px] h-[19px]" alt="" />
    <p>{{ text }}</p>
  </a>
{% endif %}
