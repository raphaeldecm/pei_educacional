{% for message in messages %}

<div id="alert" class="flex justify-center items-center text-sm h-14 px-4 text-blue-800 rounded-lg bg-zinc-50 shadow-lg border-2 border-green-600 gap-4 animate-fade" role="alert">
  <div class="">
    <i class="fas fa-exclamation-circle fa-lg"></i>
    <span class="sr-only">Info</span>
  </div>
  <div class="ms-3 text-sm font-medium">
    <p>{{ message|safe }}</p>
  </div>
</div>

{% endfor %}

{% block inline_javascript %}
<script>
  setTimeout(() => {
    const alert = document.getElementById('alert');
    if (alert) {
      alert.style.display = 'none';
    }
  }, 5000);
</script>
{% endblock inline_javascript %}
