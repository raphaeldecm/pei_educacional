{% load static i18n %}

  <div class="flex justify-center items-center gap-4">
    <button class="block md:hidden" onclick="handleToggleNav()">
      <i class="fas fa-regular fa-bars text-2xl"></i>
    </button>
    <h1>
      <a href="{% url 'home' %}">
        <img src="{% static 'images/icons/white-logo.svg' %}"/>
      </a>
    </h1>
  </div>
  {% if user.is_authenticated %}
  <nav class="hidden md:flex flex-col">
    <ul class="flex justify-center items-center gap-4">
        <li>
          <a class="" href="#">
            <i class="fas fa-home fa-lg"></i>
            Início
          </a>
        </li>

        <li>
          <a href="#' %}">
            <i class="fas fa-users fa-lg"></i>
            Usuários
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fas fa-chalkboard-teacher fa-lg"></i>
            Cursos
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fas fa-user-plus fa-lg"></i>
            Cadastrar Aluno
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-bell fa-lg"></i>
          </a>
        </li>
    </ul>
  </nav>

  <div class="relative text-left">
    <div>
      <a onclick=toggleDropdown() type="button" class="inline-flex w-full justify-center items-center gap-x-1.5 rounded-md px-3 py-2 text-sm font-semibold hover:cursor-pointer hover:bg-zinc-200/10" id="menu-button" aria-expanded="true" aria-haspopup="true">
        <div class="bg-green-500/50 py-2.5 px-3 rounded-full">
          <i class="fas fa-solid fa-user fa-lg"></i>
        </div>
        <div class="hidden lg:block">
          <p class="name">{{ request.user.name }}</p>
          <p class="email">{{ request.user.email }}</p>
        </div>
        <div class="ml-2 text-zinc-50">
          <i class="fas fa-solid fa-angle-down"></i>
        </div>
      </a>
    </div>

    <div id="dropdown" class="hidden absolute right-0 z-10 mt-2 w-56 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
      <div class="py-1" role="none">
        <!-- Active: "bg-gray-100 text-gray-900", Not Active: "text-gray-700" -->
        <a id="logoutButton" class="text-gray-700 block w-full px-4 py-2 text-left text-sm cursor-pointer" role="menuitem" aria-haspopup="true" tabindex="-1" id="menu-item-0" >
          {% trans "Sign Out" %}
        </a>

      </div>
    </div>
  </div>
  {% endif %}


    <!-- Modal de Logout -->
    {% include "../account/logout.html" %}

<script>
  function toggleDropdown() {
    const dropdown = document.getElementById('dropdown')
    dropdown.classList.toggle('hidden')
  }


  document.addEventListener('DOMContentLoaded', function() {
    /**
    * Lida com interações com um modal de logout.
    * Mostra e oculta o modal com base nas ações do usuário.
    **/

    var logoutButton = document.getElementById('logoutButton');
    var logoutModal = document.getElementById('logoutModal');
    var closeModalButton = document.getElementById('closeModalButton');

    logoutButton.addEventListener('click', function() {
      logoutModal.classList.remove('hidden');
    });

    closeModalButton.addEventListener('click', function() {
      logoutModal.classList.add('hidden');
    });

    // Caso o ususario click fora do modal vai fechar.
    window.addEventListener('click', function(event) {
      if (event.target == logoutModal) {
        logoutModal.classList.add('hidden');
      }
    });
  });
</script>
