{% load static i18n %}

  <div class="flex justify-center items-center gap-4">
    <button class="block md:hidden" onclick="handleToggleNav()">
      <i class="fas fa-regular fa-bars text-2xl"></i>
    </button>
    <h1>
      <a href="{% url 'home' %}">
        <img src="{% static 'images/icons/white-logo.svg' %}"/>
      </a>
    </h1>
  </div>
  {% if user.is_authenticated %}
  <nav class="hidden md:flex flex-col">
    <ul class="flex justify-center items-center gap-4">
        <li>
          <a class="" href="#">
            <i class="fas fa-home fa-lg"></i>
            Início
          </a>
        </li>

        <li>
          <a href="#' %}">
            <i class="fas fa-users fa-lg"></i>
            Usuários
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fas fa-chalkboard-teacher fa-lg"></i>
            Cursos
          </a>
        </li>

        <li>
          <a href="#">
            <i class="fas fa-user-plus fa-lg"></i>
            Cadastrar Aluno
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-bell fa-lg"></i>
          </a>
        </li>
    </ul>
  </nav>

  <div class="hidden relative lg:inline-block text-left">
    <div>
      <a onclick=toggleDropdown() type="button" class="inline-flex w-full justify-center items-center gap-x-1.5 rounded-md px-3 py-2 text-sm font-semibold hover:cursor-pointer" id="menu-button" aria-expanded="true" aria-haspopup="true">
        <i class="fas fa-solid fa-circle-user"></i>
        <div>
          <p class="name">{{ request.user.name }}</p>
          <p class="email">{{ request.user.email }}</p>
        </div>
        <svg class="-mr-1 h-5 w-5 text-zinc-50" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </a>
    </div>

    <div id=dropdown class="hidden absolute right-0 z-10 mt-2 w-56 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
      <div class="py-1" role="none">
        <!-- Active: "bg-gray-100 text-gray-900", Not Active: "text-gray-700" -->
        <a href="{% url 'account_logout' %}" class="text-gray-700 block w-full px-4 py-2 text-left text-sm" role="menuitem" tabindex="-1" id="menu-item-0">Sair</a>

      </div>
    </div>
  </div>
  {% endif %}

<script>

  function toggleDropdown() {
    const dropdown = document.getElementById('dropdown')
    dropdown.classList.toggle('hidden')
  }
</script>
