{% load static %}

<div class="flex items-center justify-start gap-5">
  <a href="{% url link_to_back %}"
     class="mr-2 text-[18px] py-[11px] px-[44px] border border-orange-400 rounded-lg font-medium cursor-pointer mt-[56px] hover:bg-orange-500 transition-colors duration-300">
    Voltar
  </a>

  {% if edit_url %}
    <a href="{% url edit_url object.pk %}"
       class="text-[18px] py-[11px] px-[44px] border border-green-600 rounded-lg font-medium cursor-pointer mt-[56px] hover:bg-green-500 hover:text-white transition-colors duration-300">
      Editar
    </a>
  {% else %}
    <button class="text-[18px] py-[11px] px-[44px] border border-green-600 rounded-lg font-medium cursor-pointer mt-[56px] hover:bg-green-500 hover:text-white transition-colors duration-300">
      Salvar
    </button>
  {% endif %}
</div>
